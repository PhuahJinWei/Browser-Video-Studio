<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Video Studio</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0f1115;
        color: #e6e8ec;
      }
      main { max-width: 44rem; margin: 0 auto; padding: 3rem 1.5rem; }
      h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
      p.sub { color: #9aa3b2; margin: 0 0 2rem; }
      table { border-collapse: collapse; width: 100%; }
      td { padding: .4rem .6rem; border-bottom: 1px solid #242833; vertical-align: top; }
      td.k { color: #9aa3b2; white-space: nowrap; width: 14rem; }
      .ok { color: #56d364; }
      .bad { color: #f85149; }
      .warn { color: #e3b341; }
    </style>
  </head>
  <body>
    <main>
      <h1>Browser Video Studio</h1>
      <p class="sub">Client-side video editing. Nothing is uploaded.</p>
      <table id="caps">
        <tbody><tr><td class="k">Checking…</td><td></td></tr></tbody>
      </table>
    </main>
    <script type="module" src="/src/main.ts"></script>
